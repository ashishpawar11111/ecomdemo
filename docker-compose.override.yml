"tok-comment"># docker-compose.override.yml — dev overrides (auto-loaded)
version: '3.8'
services:
  api:
    build:
      context: ./api
      target: builder        "tok-comment"># stop at build stage for dev
    command: npx nodemon src/index.js
    volumes:
      - ./api/src:/app/src   "tok-comment"># hot-reload on save
    ports:
      - "9229:9229"          "tok-comment"># Node.js debug port
    environment:
      NODE_ENV: development
  frontend:
    build:
      context: ./frontend
      target: builder
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"          "tok-comment"># Vite dev server
  postgres:
    ports:
      - "5432:5432"          "tok-comment"># expose for local psql
